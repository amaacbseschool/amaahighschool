<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e4432" />
      <stop offset="60%" stop-color="#093326" />
      <stop offset="100%" stop-color="#052018" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae084" />
      <stop offset="40%" stop-color="#d4973b" />
      <stop offset="100%" stop-color="#996316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M120 18 C175 18 206 44 206 96 C206 160 148 206 120 222 C92 206 34 160 34 96 C34 44 65 18 120 18 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="6" filter="url(#glow)" />
        
  <!-- Inner Rim Border -->
  <path d="M120 28 C166 28 194 50 194 96 C194 150 144 193 120 208 C96 193 46 150 46 96 C46 50 74 28 120 28 Z" 
        stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4 3" opacity="0.75" />

  <!-- Laurel Wreath Leaves (Left) -->
  <path d="M68 116 C62 108 64 96 72 92 C74 100 72 108 68 116 Z" fill="url(#goldGrad)" />
  <path d="M64 136 C56 128 58 116 66 112 C68 120 67 128 64 136 Z" fill="url(#goldGrad)" />
  <path d="M68 156 C62 148 64 136 72 132 C74 140 73 148 68 156 Z" fill="url(#goldGrad)" />
  <path d="M80 174 C72 168 74 156 82 152 C84 160 84 167 80 174 Z" fill="url(#goldGrad)" />

  <!-- Laurel Wreath Leaves (Right) -->
  <path d="M172 116 C178 108 176 96 168 92 C166 100 168 108 172 116 Z" fill="url(#goldGrad)" />
  <path d="M176 136 C184 128 182 116 174 112 C172 120 173 128 176 136 Z" fill="url(#goldGrad)" />
  <path d="M172 156 C178 148 176 136 168 132 C166 140 167 148 172 156 Z" fill="url(#goldGrad)" />
  <path d="M160 174 C168 168 166 156 158 152 C156 160 156 167 160 174 Z" fill="url(#goldGrad)" />

  <!-- Central Star of Excellence -->
  <polygon points="120,44 124,56 136,56 126,64 130,76 120,68 110,76 114,64 104,56 116,56" fill="url(#goldGrad)" />

  <!-- Monogram Letter "A" -->
  <text x="120" y="145" font-family="'Cinzel', Georgia, serif" font-size="76" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-1">A</text>
  
  <!-- Open Book Base of Knowledge -->
  <path d="M86 168 Q120 158 120 172 Q120 158 154 168 L154 176 Q120 166 120 180 Q120 166 86 176 Z" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Banner at bottom -->
  <path d="M50 196 L120 192 L190 196 L180 208 L120 204 L60 208 Z" fill="url(#goldGrad)" />
  <text x="120" y="202" font-family="'Outfit', sans-serif" font-size="7.5" font-weight="800" fill="#093326" text-anchor="middle" letter-spacing="1.5">VERITAS ET EXCELLENTIA</text>
</svg>
